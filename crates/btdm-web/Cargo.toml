[package]
name = "btdm-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
btdm-core = { path = "../btdm-core" }
axum = "0.8"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2"] }
# `test-util` gives the paused clock, so the command timeout can be tested
# without a test that actually waits it out.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

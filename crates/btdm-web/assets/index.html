<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Drops Miner</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --panel-2: #fafbfc;
    --ink: #14161a; --muted: #626b7a; --faint: #8a92a1;
    --line: #e1e5ea; --line-strong: #cfd5dd;
    --accent: #7d5bed; --accent-ink: #ffffff;
    --ok: #14804a; --ok-bg: #e6f4ec;
    --warn: #9a6700; --warn-bg: #fff5e0;
    --bad: #b42318; --bad-bg: #fdecea;
    --radius: 12px; --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1013; --panel: #171a1f; --panel-2: #1d2127;
      --ink: #e8eaee; --muted: #98a0ae; --faint: #6d7684;
      --line: #262b33; --line-strong: #333944;
      --accent: #a08bf5; --accent-ink: #12121a;
      --ok: #52c98a; --ok-bg: #12241a;
      --warn: #e0b64a; --warn-bg: #241f10;
      --bad: #f0776a; --bad-bg: #2a1512;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1013; --panel: #171a1f; --panel-2: #1d2127;
    --ink: #e8eaee; --muted: #98a0ae; --faint: #6d7684;
    --line: #262b33; --line-strong: #333944;
    --accent: #a08bf5; --accent-ink: #12121a;
    --ok: #52c98a; --ok-bg: #12241a;
    --warn: #e0b64a; --warn-bg: #241f10;
    --bad: #f0776a; --bad-bg: #2a1512;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 18px 60px; }

  /* ---- top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap {
    padding-block: 12px; display: flex; align-items: center;
    gap: 14px; flex-wrap: wrap;
  }
  .brand { font-weight: 680; letter-spacing: -.02em; font-size: 1.05rem;
           display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint);
         flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.down { background: var(--bad); }
  .spacer { flex: 1 1 auto; }

  /* ---- generic bits ---- */
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 16px; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 28px 0 12px; font-weight: 650; }
  h2 .count { color: var(--faint); font-weight: 500; text-transform: none;
              letter-spacing: 0; margin-left: 6px; }
  .sub { color: var(--muted); font-size: .875rem; }
  .faint { color: var(--faint); }
  .num { font-variant-numeric: tabular-nums; }
  .empty { color: var(--faint); font-style: italic; padding: 14px 0; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  button, select, input {
    font: inherit; color: inherit; border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong); background: var(--panel);
    padding: 6px 11px;
  }
  button { cursor: pointer; transition: background .12s, border-color .12s; }
  button:hover:not(:disabled) { background: var(--panel-2); border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink);
                   border-color: transparent; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
  button.tiny { padding: 3px 8px; font-size: .78rem; }
  button.icon { padding: 3px 7px; line-height: 1; }
  button.on { border-color: var(--accent); color: var(--accent); }
  input[type=search], input[type=text] { min-width: 0; }
  select { padding-right: 8px; }

  .pill { display: inline-flex; align-items: center; gap: 5px;
          padding: 2px 9px; border-radius: 999px; font-size: .74rem;
          font-weight: 600; border: 1px solid var(--line-strong);
          white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  .pill.accent { color: var(--accent); border-color: var(--accent); }

  /* ---- hero ---- */
  .hero { display: grid; gap: 16px; margin-top: 18px; }
  @media (min-width: 900px) { .hero { grid-template-columns: 1.35fr 1fr; } }
  .hero .now { display: flex; gap: 14px; align-items: flex-start; }
  .hero .headline { font-size: 1.5rem; font-weight: 680; letter-spacing: -.02em;
                    line-height: 1.2; }
  .hero a.headline { color: inherit; text-decoration: none; }
  .hero a.headline:hover { text-decoration: underline; }
  .reason { font-size: .85rem; color: var(--muted); margin-top: 8px;
            border-left: 2px solid var(--line-strong); padding-left: 10px; }
  .confirm { font-variant-numeric: tabular-nums; margin-top: 12px; font-size: 1.05rem; }
  .stale { color: var(--bad); font-weight: 650; }

  .bar { height: 8px; background: var(--line); border-radius: 999px;
         overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent);
             border-radius: 999px; transition: width .4s ease; }
  .bar.done > i { background: var(--ok); }

  /* ---- stats ---- */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
           background: var(--line); border-radius: var(--radius);
           overflow: hidden; border: 1px solid var(--line); }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  .stat { background: var(--panel); padding: 12px 14px; }
  .stat b { display: block; font-size: 1.35rem; font-weight: 680;
            letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .76rem; color: var(--muted); text-transform: uppercase;
               letter-spacing: .05em; }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line);
          margin: 26px 0 0; overflow-x: auto; }
  .tabs button { border: 0; background: none; border-radius: 0;
                 border-bottom: 2px solid transparent; padding: 9px 12px;
                 color: var(--muted); font-weight: 560; white-space: nowrap; }
  .tabs button:hover { background: none; color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink);
                                       border-bottom-color: var(--accent); }
  .tabs .badge { display: inline-block; margin-left: 6px; font-size: .72rem;
                 background: var(--line); color: var(--muted);
                 border-radius: 999px; padding: 1px 7px; font-weight: 600; }

  /* ---- campaign cards ----
     Columns rather than a grid. Campaigns have wildly different numbers of
     tiers — one has nine, the next has one — and in a two-column grid every
     row is as tall as its tallest card, so a nine-tier campaign left an
     eight-row hole beside it. Columns let each card take only its own height. */
  .cards { margin-top: 16px; columns: 1; column-gap: 14px; }
  @media (min-width: 720px) { .cards { columns: 2; } }
  @media (min-width: 1500px) { .cards { columns: 3; } }
  .cards > * { break-inside: avoid; margin-bottom: 14px; }
  .camp { overflow: hidden; display: flex; flex-direction: column; }
  .camp.current { border-color: var(--accent);
                  box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .camp.excluded { opacity: .55; }
  .camp header { display: flex; gap: 12px; padding: 14px; align-items: flex-start; }
  .art { width: 54px; height: 72px; border-radius: 6px; object-fit: cover;
         background: var(--line); flex: none; }
  .art.none { display: grid; place-items: center; color: var(--faint);
              font-size: .65rem; text-align: center; }
  .camp h3 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: -.01em; }
  .camp .meta { font-size: .8rem; color: var(--muted); margin-top: 3px; }
  .camp .acts { margin-left: auto; display: flex; gap: 4px; flex: none; }

  .drops { border-top: 1px solid var(--line); }
  .drop { display: flex; gap: 11px; padding: 10px 14px; align-items: center;
          border-bottom: 1px solid var(--line); }
  .drop:last-child { border-bottom: 0; }
  .drop.claimed { opacity: .6; }
  .drop.locked { opacity: .65; }
  .drop img, .drop .noimg { width: 34px; height: 34px; border-radius: 6px;
                            object-fit: cover; background: var(--line); flex: none; }
  .drop .body { flex: 1 1 auto; min-width: 0; }
  .drop .name { font-size: .88rem; font-weight: 560; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .drop .mins { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums;
                flex: none; }
  .drop .bar { margin-top: 5px; height: 5px; }
  .benefits { font-size: .74rem; color: var(--faint); margin-top: 2px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- lists ---- */
  table { width: 100%; border-collapse: collapse; font-size: .885rem; }
  th { text-align: left; font-weight: 600; color: var(--muted);
       font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
       padding: 8px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }

  /* ---- log ---- */
  #log { max-height: 420px; overflow-y: auto; font-size: .82rem; }
  #log .line { display: flex; gap: 10px; padding: 5px 14px;
               border-bottom: 1px solid var(--line); align-items: baseline; }
  #log .line:last-child { border-bottom: 0; }
  #log time { color: var(--faint); font-variant-numeric: tabular-nums; flex: none;
              font-size: .78rem; }
  #log .who { color: var(--muted); flex: none; font-size: .78rem; }
  #log .sev-good { color: var(--ok); }
  #log .sev-warn { color: var(--warn); }
  #log .sev-bad { color: var(--bad); font-weight: 600; }
  #log .sev-debug { color: var(--faint); }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
           background: var(--ink); color: var(--bg); padding: 9px 16px;
           border-radius: 999px; font-size: .86rem; font-weight: 560;
           box-shadow: 0 6px 24px rgba(0,0,0,.28); z-index: 50;
           opacity: 0; pointer-events: none; transition: opacity .18s; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--bad); color: #fff; }

  .banner { border-radius: var(--radius); padding: 12px 14px; margin-top: 16px;
            font-size: .9rem; border: 1px solid transparent; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem;
          background: var(--panel-2); border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 6px 3px 11px; }
  .chip button { border: 0; background: none; padding: 0 4px; color: var(--faint);
                 font-size: 1rem; line-height: 1; }
  .chip button:hover { color: var(--bad); background: none; }

  /* ---- settings ----
     Two columns, because each of these panels is three lines tall and stacking
     them one per row made a screen and a half of mostly empty space. */
  .settings-grid { display: grid; gap: 14px; margin-top: 16px; }
  @media (min-width: 860px) { .settings-grid { grid-template-columns: 1fr 1fr; } }
  .setting h2 { margin-top: 0; }
  .setting.wide { grid-column: 1 / -1; }

  .field { display: grid; gap: 5px; margin-bottom: 16px; }
  .field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
  .field .hint { font-size: .78rem; color: var(--faint); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand"><span class="dot" id="conn-dot"></span> Twitch Drops Miner</div>
    <span class="sub" id="conn-text">connecting…</span>
    <span class="spacer"></span>
    <span id="account-picker" class="row"></span>
    <button id="theme" class="icon" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</div>

<div class="wrap">
  <div id="app">
    <div class="panel pad" style="margin-top:20px">
      <div class="empty">Waiting for the miner to report…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------
  // Plumbing
  // ---------------------------------------------------------------------
  const token = new URLSearchParams(location.search).get("token");
  const api = (path) => path + (token ? (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : "");

  const state = {
    snapshots: new Map(),   // account -> snapshot
    current: null,          // selected account
    tab: "campaigns",
    /// Exactly what the user typed. Normalised at match time, never here.
    search: "",
    log: [],
    connected: false,
    // What the user has typed but not yet submitted. Held here rather than in
    // the DOM because a snapshot arrives every heartbeat and the page rebuilds
    // itself from scratch — anything living only in an input element would be
    // wiped mid-sentence.
    drafts: {},
    logScroll: 0,
    renderError: null,
    adding: false,
    // Loaded from the miner's own stored log, so the page is not blank about
    // everything that happened before it was opened.
    history: [],
    historyFor: null,
    logins: [],
    accountErrors: {},
    rewards: [],
    rewardsFor: null,
    rewardsLoaded: false,
    rewardsFetching: null,
    rewardsAttempted: null,
    rewardsError: null,
    historyLoaded: false,
    historyFetching: null,
    historyAttempted: null,
  };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };
  const $ = (sel) => document.querySelector(sel);

  let toastTimer = null;
  function toast(message, isError) {
    const t = $("#toast");
    t.textContent = message;
    t.className = "toast show" + (isError ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = "toast"; }, 3200);
  }

  async function send(account, command) {
    try {
      const res = await fetch(api(`/api/accounts/${encodeURIComponent(account)}/command`), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(command),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        toast(body.error || `Failed (HTTP ${res.status})`, true);
        return false;
      }
      // 202: queued, but the miner had not acted on it before the server gave
      // up waiting. Reporting that in the success style would say the setting
      // had been applied when it may never be — and would clear the box the
      // user typed into, losing what they wrote.
      if (res.status === 202) {
        toast(body.message || "The miner is busy; this may not have applied", true);
        return false;
      }
      // Otherwise the miner's own words. Showing those beats an optimistic
      // message written here, which could not tell "strategy changed" from
      // "that strategy was already selected" — and said the former either way.
      if (body.message) toast(body.message);
      return true;
    } catch (e) {
      toast("The miner is unreachable", true);
      return false;
    }
  }

  /// Fetches an account's stored history once.
  ///
  /// `historyFor` is only moved once the rows have actually arrived. Claiming
  /// the new account before the fetch landed meant the previous account's rows
  /// were shown — and attributed — to the new one for as long as the request
  /// took.
  async function loadHistory(account) {
    if (state.historyFetching === account) return;
    if (state.historyFor === account && state.historyLoaded) return;
    if (state.historyAttempted === account) return;
    state.historyAttempted = account;
    state.historyFetching = account;
    try {
      const res = await fetch(api(`/api/history?account=${encodeURIComponent(account)}&limit=300`));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.history = await res.json();
      state.historyFor = account;
      state.historyLoaded = true;
    } catch (e) {
      // Left un-loaded, so re-entering the tab tries again.
    } finally {
      state.historyFetching = null;
      if (state.tab === "log") render();
    }
  }

  /// A dead token used to need shell access to fix, which is no answer at all
  /// on the headless box this targets.
  async function loadLogins() {
    try {
      const res = await fetch(api("/api/logins"));
      if (!res.ok) return;
      const body = await res.json();
      const before = JSON.stringify([state.logins, state.accountErrors]);
      state.logins = body.logins || [];
      state.accountErrors = body.errors || {};
      if (JSON.stringify([state.logins, state.accountErrors]) !== before) render();
    } catch (e) { /* the rest of the page still works */ }
  }

  async function beginLogin(account) {
    try {
      const res = await fetch(api(`/api/accounts/${encodeURIComponent(account)}/login`), {
        method: "POST",
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { toast(body.error || "Could not start the login", true); return; }
      toast("Starting login…");
      loadLogins();
    } catch (e) { toast("The miner is unreachable", true); }
  }

  /// Fetches an account's claimed rewards once.
  ///
  /// The in-flight marker is separate from the loaded marker. Using one for
  /// both meant a failed request left the tab claiming "Loading…" with nothing
  /// loading and nothing that would ever retry — leaving and returning did
  /// not, because the guard had already recorded this account as done.
  async function loadRewards(account) {
    if (state.rewardsFetching === account) return;
    if (state.rewardsFor === account && state.rewardsLoaded) return;
    // One attempt per visit. Retrying on every render would be a loop: the
    // failure re-renders, the render asks again, and the page spins.
    if (state.rewardsAttempted === account) return;
    state.rewardsAttempted = account;
    state.rewardsFetching = account;
    try {
      const res = await fetch(api(`/api/rewards?account=${encodeURIComponent(account)}&limit=500`));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.rewards = await res.json();
      state.rewardsFor = account;
      state.rewardsLoaded = true;
    } catch (e) {
      // Left un-loaded on purpose, so the next visit tries again.
      state.rewardsError = String(e);
    } finally {
      state.rewardsFetching = null;
      if (state.tab === "rewards") render();
    }
  }

  // ---------------------------------------------------------------------
  // Formatting
  //
  // Nothing here invents a number. Minutes always come from the snapshot,
  // which only ever carries figures Twitch confirmed. The only thing counted
  // locally is time until a deadline, which is a clock, not progress.
  // ---------------------------------------------------------------------
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  /// A text box whose contents survive the page rebuilding underneath it.
  /// Drafts are per *account*.
  ///
  /// They were keyed on the element id alone, and every account's page uses
  /// the same ids. So typing a channel into the pin box under one account and
  /// switching to another pre-filled that account's box with the first one's
  /// text — and one click then posted it to the wrong account. Half-typed
  /// input surviving a rebuild is the point of drafts; surviving a change of
  /// *subject* is not.
  const draftKey = (id) => `${state.current || "?"}::${id}`;

  function draftInput(id, placeholder, fallback, onEnter) {
    const key = draftKey(id);
    const input = el("input");
    input.type = "text";
    input.id = id;
    input.placeholder = placeholder;
    input.value = state.drafts[key] !== undefined ? state.drafts[key] : (fallback || "");
    input.oninput = () => { state.drafts[key] = input.value; };
    if (onEnter) {
      input.onkeydown = (e) => { if (e.key === "Enter") onEnter(input.value.trim()); };
    }
    return input;
  }

  const clearDraft = (id) => { delete state.drafts[draftKey(id)]; };

  /// A finite number, or null. Everything on this page comes from a JSON
  /// payload, and a field that is absent, null, a string, or NaN must not
  /// become part of a figure — printing "NaN" or "undefined" at the user is
  /// exactly the invented-number problem this project exists to avoid, just
  /// with a different shape.
  function num(v) {
    return typeof v === "number" && Number.isFinite(v) ? v : null;
  }

  /// A valid date, or null.
  function when(v) {
    if (v === null || v === undefined) return null;
    const t = new Date(v).getTime();
    return Number.isFinite(t) ? new Date(t) : null;
  }

  /// An array, whatever arrived.
  function list0(v) {
    return Array.isArray(v) ? v : [];
  }

  function ago(seconds) {
    seconds = num(seconds);
    if (seconds === null) return "never";
    // A clock skew between a headless miner and this browser can put a
    // timestamp in the future. "-3600s ago" is not a time.
    if (seconds < 0) return "just now";
    if (seconds < 60) return `${seconds}s ago`;
    const m = Math.floor(seconds / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    return h < 48 ? `${h}h ${m % 60}m ago` : `${Math.floor(h / 24)}d ago`;
  }

  function until(iso) {
    const at = when(iso);
    if (!at) return "no end date";
    const ms = at.getTime() - Date.now();
    if (ms <= 0) return "ended";
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return `${mins}m left`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 48) return `${hrs}h ${mins % 60}m left`;
    return `${Math.floor(hrs / 24)}d left`;
  }

  function hours(mins) {
    mins = num(mins);
    if (mins === null) return "—";
    const neg = mins < 0;
    const m = Math.abs(mins);
    const text = m < 60 ? `${m}m` : m < 1440 ? `${Math.floor(m / 60)}h ${m % 60}m`
                                             : `${Math.floor(m / 1440)}d ${Math.floor((m % 1440) / 60)}h`;
    return neg ? `−${text}` : text;
  }

  function bar(percent, done) {
    const b = el("div", "bar" + (done ? " done" : ""));
    const fill = el("i");
    fill.style.width = Math.max(0, Math.min(100, num(percent) || 0)) + "%";
    b.append(fill);
    return b;
  }

  function image(rawUrl, cls, alt) {
    const url = safeUrl(rawUrl);
    if (!url) {
      const ph = el("div", cls + " noimg");
      return ph;
    }
    const img = el("img", cls);
    img.src = url;
    img.alt = alt || "";
    img.loading = "lazy";
    // A missing picture must never look like a broken page.
    img.onerror = () => { img.replaceWith(el("div", cls + " noimg")); };
    return img;
  }

  const twitchUrl = (login) => "https://twitch.tv/" + encodeURIComponent(login || "");

  /// A URL safe to put in an href or an img src.
  ///
  /// Everything on this page comes from Twitch by way of the miner, and a
  /// `javascript:` URL in a link the user is being *encouraged* to click —
  /// "Link account →" — would run on click. Only http(s) is ever emitted;
  /// anything else is dropped, so the link simply does not appear.
  function safeUrl(url) {
    if (typeof url !== "string") return null;
    const trimmed = url.trim();
    return /^https?:\/\//i.test(trimmed) ? trimmed : null;
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  /// Fills in anything the payload is missing.
  ///
  /// The page builds itself top to bottom, so one absent field used to throw
  /// part-way through and leave a half-rendered page — header and hero, no
  /// tabs, no way back. A snapshot from an older miner, or a partial one from
  /// a proxy, must degrade to "that section is empty" rather than to a broken
  /// page with no navigation.
  function normalise(s) {
    if (!s || typeof s !== "object" || Array.isArray(s)) return null;
    return {
      ...s,
      account: typeof s.account === "string" ? s.account : "unknown",
      strategy: s.strategy || "unknown",
      state: s.state || "Unknown",
      eligible: Array.isArray(s.eligible) ? s.eligible : [],
      rejected: Array.isArray(s.rejected) ? s.rejected : [],
      live: Array.isArray(s.live) ? s.live : [],
      strategies: Array.isArray(s.strategies) ? s.strategies : [],
      settings: {
        strategy: "", priority_games: [], favourites: [], pinned: null,
        excluded_campaigns: [], excluded_games: [],
        ...(s.settings && typeof s.settings === "object" ? s.settings : {}),
      },
      health: {
        verdict: "unknown", seconds_since_confirmation: null, recovery_step: null,
        last_sync: null, next_sync_in_seconds: null,
        quarantined_channels: [], quarantined_campaigns: [],
        ...(s.health && typeof s.health === "object" ? s.health : {}),
      },
      totals: {
        campaigns_known: 0, campaigns_eligible: 0, campaigns_at_risk: 0,
        drops_claimed: 0, drops_remaining: 0, drops_claimable: 0,
        minutes_remaining: 0,
        ...(s.totals && typeof s.totals === "object" ? s.totals : {}),
      },
    };
  }

  function snap() {
    if (state.current && state.snapshots.has(state.current)) {
      return state.snapshots.get(state.current);
    }
    return state.snapshots.values().next().value || null;
  }

  /// Keeps the existing picker when its options have not changed.
  ///
  /// Rebuilding it every heartbeat closed it under anyone who had it open —
  /// a dropdown that shuts itself once a minute cannot be used.
  function renderAccountPicker() {
    const host = $("#account-picker");
    const names = [...state.snapshots.keys()];
    if (names.length <= 1) {
      host.textContent = "";
      return;
    }

    const existing = host.querySelector("select");
    const same = existing
      && [...existing.options].map((o) => o.value).join("\u0000") === names.join("\u0000");
    if (same) {
      const want = state.current || names[0];
      if (existing.value !== want) existing.value = want;
      return;
    }

    host.textContent = "";
    const sel = el("select");
    names.forEach((n) => {
      const o = el("option", null, n);
      o.value = n;
      if (n === (state.current || names[0])) o.selected = true;
      sel.append(o);
    });
    sel.onchange = () => { state.current = sel.value; render(); };
    host.append(sel);
  }

  function connection() {
    $("#conn-dot").className = "dot " + (state.connected ? "live" : "down");
    $("#conn-text").textContent = state.connected ? "live" : "reconnecting…";
  }

  function heroPanel(s) {
    const panel = el("div", "panel pad");
    const w = s.watching;

    // Which account this is. With one account it was nowhere on screen, and
    // with several the picker alone does not tell you whose numbers these are.
    const who = el("div", "sub");
    who.style.marginBottom = "6px";
    who.append(el("span", "pill", s.account));
    if (s.login) {
      who.append(document.createTextNode(" "));
      who.append(el("span", null, s.login));
    }
    panel.append(who);

    if (s.paused) {
      panel.append(el("div", "headline", "Paused"));
      panel.append(el("div", "sub", "Mining is stopped. Campaigns are still tracked so nothing expires unnoticed."));
      return panel;
    }
    if (!w) {
      panel.append(el("div", "headline", "Idle"));
      const why = s.eligible.length
        ? "No live channel can progress any of your campaigns right now."
        : "No campaign is currently mineable.";
      panel.append(el("div", "sub", why));
      if (s.health.recovery_step) {
        panel.append(el("div", "reason", "Recovering: " + s.health.recovery_step));
      }
      return panel;
    }

    const head = el("div", "row");
    const link = el("a", "headline", w.channel_display_name || w.channel_login);
    link.href = twitchUrl(w.channel_login);
    link.target = "_blank";
    link.rel = "noreferrer noopener";
    head.append(link);
    head.append(el("span", "pill " + (w.stalled ? "bad" : "ok"), w.stalled ? "STALLED" : "mining"));
    // Whether Twitch named these drops for this channel, or the miner inferred
    // them from the directory's drops-enabled tag. Since Twitch stopped
    // listing game campaigns per channel the answer is nearly always the
    // latter, and saying so is better than implying a confirmation there is
    // no evidence for.
    // Only once something actually has been confirmed. Printed beside "No
    // progress confirmed by Twitch yet" it reads as the page arguing with
    // itself — these are two different facts (Twitch named the drops for this
    // channel; Twitch has credited minutes) and the badge is not worth the
    // confusion until the second one is also true.
    if (w.confirmed_by_twitch && num(w.current_minutes) !== null) {
      const p = el("span", "pill ok", "confirmed by Twitch");
      p.title = "Twitch named these drops as progressable on this channel.";
      head.append(p);
    }
    const watchedCampaigns = Array.isArray(w.campaigns) ? w.campaigns : [];
    if (watchedCampaigns.length > 1) {
      head.append(el("span", "pill accent", `${watchedCampaigns.length} campaigns at once`));
    }
    panel.append(head);

    if (w.stream_title) {
      const t = el("div", "sub");
      t.textContent = w.stream_title;
      t.style.marginTop = "2px";
      panel.append(t);
    }
    panel.append(el("div", "sub", watchedCampaigns.join(" · ")));

    const line = el("div", "confirm");
    const current = num(w.current_minutes);
    const required = num(w.required_minutes);
    if (current === null || required === null) {
      line.append(el("span", "sub", "No progress confirmed by Twitch yet"));
    } else {
      line.append(document.createTextNode(
        `${w.drop_name ? w.drop_name + " — " : ""}${current}/${required} min confirmed`));
    }
    panel.append(line);

    if (current !== null && required) {
      panel.append(bar((current / required) * 100, current >= required));
    }

    // Only meaningful once something *has* been confirmed. Printed
    // unconditionally it produced "No progress confirmed by Twitch yet"
    // directly above "Last confirmed by Twitch: 1m ago", which are two
    // different clocks — the session's confirmed minutes, and the account-wide
    // health clock — and read as the page contradicting itself.
    const confirmed = w.current_minutes !== null && w.current_minutes !== undefined;
    if (w.seconds_since_confirmation !== null &&
        w.seconds_since_confirmation !== undefined &&
        (confirmed || w.stalled)) {
      const since = el("div", "sub");
      since.style.marginTop = "8px";
      since.append(document.createTextNode("Last confirmed by Twitch: "));
      since.append(el("span", w.stalled ? "stale" : "", ago(w.seconds_since_confirmation)));
      // Once the stream is down these figures stop advancing while continuing
      // to read as current. A page whose whole promise is that its numbers are
      // real has to say when they have stopped being fresh.
      if (!state.connected) {
        const stale = el("span", "stale", " — frozen: no connection to the miner");
        stale.title = "The connection to the miner is down, so this figure has stopped advancing.";
        since.append(stale);
      }
      panel.append(since);
    } else if (!confirmed) {
      const waiting = el("div", "sub");
      waiting.style.marginTop = "8px";
      waiting.textContent = "Waiting for Twitch to confirm the first minute on this channel.";
      panel.append(waiting);
    }

    if (w.reason) panel.append(el("div", "reason", w.reason));
    if (s.health.recovery_step) {
      panel.append(el("div", "banner warn", "Recovering: " + s.health.recovery_step));
    }
    return panel;
  }

  /// Whether the selected strategy actually reads the priority list. Showing
  /// its editor under any other strategy would imply it has an effect.
  /// The strategy actually in force.
  ///
  /// Two sources existed: the `selected` flag on the strategy list, and
  /// `settings.strategy`. When they disagreed the picker showed one and every
  /// warning named the other — and with nothing flagged `selected` the picker
  /// silently presented its first option as current. `settings.strategy` is
  /// the miner's own answer, so it wins; the flag is only a fallback for a
  /// payload that omits it.
  function currentStrategy(s) {
    if (s.settings && s.settings.strategy) return s.settings.strategy;
    const flagged = list0(s.strategies).find((x) => x.selected);
    return flagged ? flagged.name : "";
  }

  function usesPriority(s) {
    return currentStrategy(s).startsWith("priority");
  }

  /// The ordered game/campaign list the priority strategies rank by. Rendered
  /// wherever the strategy is chosen, so the setting and its input stay
  /// together.
  function priorityEditor(s, inForce) {
    const acct = s.account;
    const wrap = el("div", "field");
    wrap.style.marginTop = "14px";
    wrap.append(el("label", null, "Priority order"));

    // Defensive: every control below addresses an entry by its text, because
    // that is what the miner's commands take. A repeated entry would make two
    // chips whose buttons send byte-identical commands — clicking the second
    // acts on the first. The miner deduplicates, so this only guards against a
    // payload that somehow carries one.
    const list = [...new Set(list0(s.settings.priority_games))];
    const chips = el("div", "chips");
    if (!list.length) {
      const warn = el("div", "hint");
      warn.style.color = "var(--warn)";
      warn.textContent = (inForce === "priority-only")
        ? "Empty — this strategy mines nothing until you add something."
        : "Empty — nothing is being prioritised yet.";
      wrap.append(warn);
    }
    list.forEach((g, i) => {
      const chip = el("div", "chip");
      chip.append(document.createTextNode(`${i + 1}. ${g}`));
      // Reordering matters more than anything else here: the list *is* the
      // ranking, and being unable to change it meant removing and retyping.
      //
      // Each edit names one entry rather than sending a rewritten list. A
      // rewritten list is computed from the snapshot on screen, which the
      // miner may already have moved past — clicking ↑ twice quickly then
      // discards the first move.
      if (i > 0) {
        const up = el("button", null, "↑");
        up.title = "Move up";
        up.onclick = () => send(acct, { command: "move_priority_entry", entry: g, up: true });
        chip.append(up);
      }
      if (i < list.length - 1) {
        const down = el("button", null, "↓");
        down.title = "Move down";
        down.onclick = () => send(acct, { command: "move_priority_entry", entry: g, up: false });
        chip.append(down);
      }
      const x = el("button", null, "×");
      x.title = "Remove";
      x.onclick = () => send(acct, { command: "remove_priority_entry", entry: g });
      chip.append(x);
      chips.append(chip);
    });
    chips.style.margin = "8px 0";
    wrap.append(chips);

    const row = el("div", "row");
    const add = async (v) => {
      if (!v || state.adding) return;
      // Without this guard the box still reads what was typed — `clearDraft`
      // only touches the store, and nothing redrew — so it looks unsent and a
      // second click posts it again.
      state.adding = true;
      try {
        if (await send(acct, { command: "add_priority_entry", entry: v })) {
          clearDraft("priority-input");
          render();
        }
      } finally {
        state.adding = false;
      }
    };
    const input = draftInput("priority-input", "Game or campaign name", "", add);
    input.style.flex = "1 1 160px";
    const btn = el("button", null, "Add");
    btn.onclick = () => add(input.value.trim());
    row.append(input, btn);
    wrap.append(row);
    wrap.append(el("div", "hint",
      "Matched against both game and campaign names, so two campaigns for the " +
      "same game can be ranked against each other."));
    return wrap;
  }

  function controlsPanel(s) {
    const panel = el("div", "panel pad");
    const acct = s.account;

    // Strategy
    const f1 = el("div", "field");
    f1.append(el("label", null, "Strategy"));
    const sel = el("select");
    // Identified so focus survives the rebuild. `captureFocus` restores by id,
    // and a control without one is dropped to <body> on every heartbeat —
    // which for a keyboard user means this picker cannot be reached at all.
    sel.id = "strategy";
    const inForce = currentStrategy(s);
    // A strategy the miner reports but does not list must still be shown as
    // current, or the picker quietly claims a different one is.
    const names = list0(s.strategies).map((st) => st.name);
    if (inForce && !names.includes(inForce)) names.unshift(inForce);
    names.forEach((name) => {
      const o = el("option", null, name);
      o.value = name;
      if (name === inForce) o.selected = true;
      sel.append(o);
    });
    sel.onchange = () => send(acct, { command: "set_strategy", name: sel.value });
    f1.append(sel);
    const chosen = list0(s.strategies).find((x) => x.name === inForce);
    f1.append(el("div", "hint", chosen ? chosen.description : ""));
    panel.append(f1);

    // The priority list belongs with the strategy that reads it. It used to
    // live on the Settings tab, which meant selecting "priority" — a strategy
    // that mines *nothing* until it has a list — gave you a miner that had
    // visibly stopped, and no indication that the thing to fix was two tabs
    // away. Shown here, and only when it is actually consulted.
    if (usesPriority(s)) panel.append(priorityEditor(s, inForce));

    // Buttons
    const acts = el("div", "row");
    const pause = el("button", s.paused ? "primary" : "", s.paused ? "Resume mining" : "Pause mining");
    // The reply is the miner's own confirmation, sent once it has actually
    // applied the command, so the toast reports the change rather than
    // predicting it.
    pause.onclick = () => send(acct, { command: s.paused ? "resume" : "pause" });
    acts.append(pause);

    const sw = el("button", null, "Switch channel");
    sw.disabled = !s.watching;
    sw.onclick = async () => {
      await send(acct, { command: "switch_channel" });
    };
    acts.append(sw);

    const sync = el("button", null, "Refresh campaigns");
    sync.onclick = async () => {
      await send(acct, { command: "sync_now" });
    };
    acts.append(sync);

    const penalties = s.health.quarantined_channels.length + s.health.quarantined_campaigns.length;
    if (penalties) {
      const clear = el("button", null, `Clear ${plural(penalties, "penalty")}`.replace("penaltys", "penalties"));
      clear.onclick = () => send(acct, { command: "clear_quarantine" });
      acts.append(clear);
    }
    panel.append(acts);
    return panel;
  }

  function statsStrip(s) {
    const t = s.totals;
    const box = el("div", "stats");
    const add = (value, label) => {
      const d = el("div", "stat");
      d.append(el("b", null, value));
      d.append(el("span", null, label));
      box.append(d);
    };
    // A total that did not arrive as a number is not a total. "—" says that;
    // "null/null" says the miner reported something it did not.
    const count = (v) => { const n = num(v); return n === null ? "—" : String(n); };
    add(`${count(t.campaigns_eligible)}/${count(t.campaigns_known)}`, "campaigns mineable");
    add(count(t.drops_claimed), "drops claimed");
    add(count(t.drops_remaining), "drops remaining");
    add(hours(t.minutes_remaining), "watching left");
    add(count(t.campaigns_at_risk), "at risk");
    add(s.live.length, "channels live now");
    return box;
  }

  function matches(text) {
    const needle = state.search.trim().toLowerCase();
    if (!needle) return true;
    return (text || "").toLowerCase().includes(needle);
  }

  function campaignCard(s, c) {
    const card = el("div", "panel camp" +
      (c.is_current ? " current" : "") + (c.excluded ? " excluded" : ""));

    const head = el("header");
    head.append(image(c.box_art_url, "art", c.game));

    const info = el("div");
    info.style.minWidth = "0";
    info.append(el("h3", null, c.name || "(unnamed campaign)"));
    info.append(el("div", "meta", c.game));

    const tags = el("div", "row");
    tags.style.marginTop = "6px";
    tags.style.gap = "5px";
    if (c.is_current) tags.append(el("span", "pill accent", "mining now"));
    if (c.excluded) tags.append(el("span", "pill", "excluded"));
    else if (c.slack_minutes < 0) tags.append(el("span", "pill bad", "cannot finish"));
    else if (c.at_risk) tags.append(el("span", "pill warn", "at risk"));
    tags.append(el("span", "pill", until(c.ends_at)));
    tags.append(el("span", "pill", hours(c.remaining_minutes) + " to go"));
    if (c.live_channels) tags.append(el("span", "pill", plural(c.live_channels, "channel") + " live"));
    else tags.append(el("span", "pill", "nobody live"));
    const allowed = (c.allowed_channels || []).length;
    if (allowed) {
      // "only 463 channels" is not a restriction anyone recognises as one.
      // A handful is worth calling out; a directory-sized list is not.
      const pill = el("span", "pill", allowed <= 12
        ? `only ${plural(allowed, "channel")}`
        : `${allowed} specific channels`);
      pill.title = c.allowed_channels.slice(0, 40).join(", ") +
        (allowed > 40 ? `, and ${allowed - 40} more` : "");
      tags.append(pill);
    }
    info.append(tags);
    head.append(info);

    const acts = el("div", "acts");
    const ex = el("button", "tiny", c.excluded ? "Include" : "Exclude");
    ex.title = c.excluded ? "Mine this campaign again" : "Never mine this campaign";
    ex.onclick = () => send(s.account, {
      command: "set_campaign_excluded", campaign: c.id, excluded: !c.excluded,
    });
    acts.append(ex);
    head.append(acts);
    card.append(head);

    if ((c.drops || []).length) {
      const list = el("div", "drops");
      (c.drops || []).forEach((d) => list.append(dropRow(d)));
      card.append(list);
    }
    return card;
  }

  function dropRow(d) {
    const row = el("div", "drop" + (d.is_claimed ? " claimed" : "") + (d.locked ? " locked" : ""));
    const benefits = Array.isArray(d.benefits) ? d.benefits : [];
    const art = benefits.find((b) => b.image_url);
    row.append(image(art ? art.image_url : null, "", d.name));

    const body = el("div", "body");
    const name = el("div", "name");
    name.append(document.createTextNode(d.name || "(unnamed drop)"));
    if (d.active) {
      const p = el("span", "pill accent", "earning");
      p.style.marginLeft = "6px";
      name.append(p);
    }
    body.append(name);

    // Most drops are named after their only reward, and printing both left
    // rows reading "Madden Twitch Pack / Madden Twitch Pack".
    const rewards = benefits.map((b) => b.name).filter((n) => n && n !== d.name);
    if (rewards.length) body.append(el("div", "benefits", rewards.join(", ")));

    const needsSub = (num(d.required_subs) || 0) > 0;
    // Drawn from the same two numbers printed beside it. `percent` is a third
    // figure that can disagree with them, and a full green bar next to "5/60m"
    // is the page contradicting itself about the one thing it exists to
    // report. `percent` is only used when the minutes are missing.
    if (!d.is_claimed && !needsSub) {
      const cur = num(d.current_minutes), req = num(d.required_minutes);
      const pct = cur !== null && req ? (cur / req) * 100 : num(d.percent) || 0;
      body.append(bar(pct, pct >= 100));
    }
    row.append(body);

    const mins = el("div", "mins");
    if (d.is_claimed) mins.append(el("span", "pill ok", "claimed"));
    else if (needsSub) {
      const p = el("span", "pill warn", d.required_subs > 1
        ? `${d.required_subs} subs` : "needs a sub");
      p.title = "Twitch gives this for subscribing, not for watching. " +
                "The miner will never earn it.";
      mins.append(p);
    }
    else if (d.claimable) mins.append(el("span", "pill ok", "claiming"));
    else if (d.locked) mins.append(el("span", "pill", "locked"));
    else {
      // Both halves or neither. Half a figure is not a figure.
      const cur = num(d.current_minutes), req = num(d.required_minutes);
      mins.textContent = cur !== null && req !== null ? `${cur}/${req}m` : "not reported";
    }
    row.append(mins);

    return row;
  }

  function campaignsTab(s) {
    const box = el("div");
    const list = s.eligible.filter((c) => matches(c.name) || matches(c.game));
    if (!list.length) {
      const p = el("div", "panel pad");
      p.style.marginTop = "16px";
      p.append(el("div", "empty",
        state.search.trim() ? "Nothing matches that search." : "No mineable campaigns."));
      box.append(p);
      return box;
    }

    // Sort: what is being mined, then risk, then soonest deadline.
    list.sort((a, b) =>
      (b.is_current - a.is_current) ||
      (a.excluded - b.excluded) ||
      (b.at_risk - a.at_risk) ||
      (new Date(a.ends_at) - new Date(b.ends_at)));

    const cards = el("div", "cards");
    list.forEach((c) => cards.append(campaignCard(s, c)));
    box.append(cards);
    return box;
  }

  function liveTab(s) {
    const box = el("div");
    const list = s.live.filter((c) => matches(c.display_name) || matches(c.game));
    if (!list.length) {
      const p = el("div", "panel pad");
      p.append(el("div", "empty",
        s.live.length
          ? "No live channel matches that search."
          : "No live channel can progress any of your drops right now."));
      box.append(p);
      return box;
    }

    // Said once rather than badged on every row: since Twitch stopped listing
    // game campaigns per channel, almost nothing is confirmed, and repeating
    // "inferred" ninety times tells the reader nothing.
    const confirmed = list.filter((c) => c.confirmed_by_twitch).length;
    if (confirmed < list.length) {
      const note = el("div", "sub");
      note.style.margin = "14px 0 0";
      note.textContent = confirmed === 0
        ? "Twitch is not naming drops per channel at the moment, so these are "
          + "channels streaming a campaign's game with drops enabled."
        : `${confirmed} of ${list.length} are confirmed by Twitch; the rest are `
          + "channels streaming a campaign's game with drops enabled.";
      box.append(note);
    }

    const panel = el("div", "panel scroll");
    panel.style.marginTop = "16px";
    const table = el("table");
    const thead = el("thead"), hr = el("tr");
    ["Channel", "Viewers", "Would advance", "", ""].forEach((h) => hr.append(el("th", null, h)));
    thead.append(hr);
    table.append(thead);

    const tbody = el("tbody");
    list.sort((a, b) => (b.is_current - a.is_current) || (b.drops - a.drops) || (b.viewers - a.viewers));
    list.forEach((c) => {
      const tr = el("tr");

      const nameCell = el("td");
      const a = el("a", null, c.display_name);
      a.href = twitchUrl(c.login);
      a.target = "_blank";
      a.rel = "noreferrer noopener";
      a.style.color = "inherit";
      nameCell.append(a);
      if (c.is_current) {
        const p = el("span", "pill accent", "watching");
        p.style.marginLeft = "7px";
        nameCell.append(p);
      }
      if (c.title) {
        const sub = el("div", "sub", c.title);
        sub.style.fontSize = ".78rem";
        sub.style.maxWidth = "34ch";
        sub.style.overflow = "hidden";
        sub.style.textOverflow = "ellipsis";
        sub.style.whiteSpace = "nowrap";
        nameCell.append(sub);
      }
      tr.append(nameCell);

      const viewers = num(c.viewers);
      tr.append(el("td", "num", viewers === null ? "—" : viewers.toLocaleString()));

      const what = el("td");
      const chanCampaigns = list0(c.campaigns);
      what.append(document.createTextNode(
        `${plural(chanCampaigns.length, "campaign")}, ${plural(num(c.drops) || 0, "drop")}`));
      // Whether Twitch named these drops for this channel, or the miner
      // inferred them from the directory's drops-enabled tag. The table used
      // to say nothing, presenting inference as fact on every row.
      //
      // Only the confirmed case is badged. Since Twitch stopped listing game
      // campaigns per channel, "inferred" is true of nearly every row, and a
      // badge on all of them is noise that says nothing — the note above the
      // table carries that instead.
      if (c.confirmed_by_twitch) {
        const how = el("span", "pill ok", "confirmed");
        how.title = "Twitch named these drops as progressable on this channel.";
        how.style.marginLeft = "7px";
        what.append(how);
      }
      const names = el("div", "sub", chanCampaigns.join(", "));
      names.style.fontSize = ".78rem";
      what.append(names);
      tr.append(what);

      const favCell = el("td");
      const fav = el("button", "tiny icon" + (c.is_favourite ? " on" : ""), c.is_favourite ? "★" : "☆");
      fav.title = c.is_favourite ? "Remove from favourites" : "Prefer this channel";
      fav.onclick = () => send(s.account, {
        command: "set_favourite", login: c.login, on: !c.is_favourite,
      });
      favCell.append(fav);
      tr.append(favCell);

      const actCell = el("td");
      const watch = el("button", "tiny", "Watch");
      watch.disabled = c.is_current;
      watch.onclick = async () => {
        if (await send(s.account, { command: "watch_channel", login: c.login })) {
          /* the miner's own reply is already shown by `send` */
        }
      };
      actCell.append(watch);
      tr.append(actCell);

      tbody.append(tr);
    });
    table.append(tbody);
    panel.append(table);
    box.append(panel);
    return box;
  }

  function unavailableTab(s) {
    const box = el("div");
    const list = s.rejected.filter((r) => matches(r.name) || matches(r.game) || matches(r.reason));
    if (!list.length) {
      const p = el("div", "panel pad");
      p.append(el("div", "empty", "Nothing is being skipped."));
      box.append(p);
      return box;
    }

    const groups = new Map();
    list.forEach((r) => {
      // The explanation belongs to the campaign, not to the group: two
      // campaigns rejected for the same reason can have different detail, and
      // taking whichever arrived first described the rest with someone else's
      // words.
      if (!groups.has(r.reason)) groups.set(r.reason, { explanations: new Set(), items: [] });
      if (r.explanation) groups.get(r.reason).explanations.add(r.explanation);
      groups.get(r.reason).items.push(r);
    });

    [...groups.entries()]
      .sort((a, b) => b[1].items.length - a[1].items.length)
      .forEach(([reason, group]) => {
        const h = el("h2");
        h.append(document.createTextNode(reason));
        h.append(el("span", "count", `${group.items.length}`));
        box.append(h);
        // One line when they agree, which is the normal case; otherwise each
        // campaign's own, so none is described by another's.
        if (group.explanations.size === 1) {
          box.append(el("div", "sub", [...group.explanations][0]));
        }

        const panel = el("div", "panel scroll");
        panel.style.marginTop = "10px";
        const table = el("table"), tbody = el("tbody");
        group.items
          .sort((a, b) => (a.game || "").localeCompare(b.game || ""))
          .forEach((r) => {
            const tr = el("tr");
            // Its own explanation, always, whether or not the group shares one.
            if (r.explanation) tr.title = r.explanation;

            const nameCell = el("td");
            nameCell.append(document.createTextNode(r.name || "(unnamed)"));
            // "Not started" is only useful if it says when.
            // Shadowing the `when` helper here is what let an unparseable
            // date through as "in NaN days".
            const startsAt = when(r.starts_at);
            if (reason === "not started" && startsAt) {
                const days = Math.round((startsAt.getTime() - Date.now()) / 86400000);
                const soon = el("span", "pill", days <= 0
                    ? "starts today"
                    : days === 1 ? "starts tomorrow" : `in ${days} days`);
                soon.style.marginLeft = "7px";
                soon.title = startsAt.toLocaleString();
                nameCell.append(soon);
            }
            tr.append(nameCell);
            tr.append(el("td", "sub", r.game));

            // "Your account is not linked" without saying where to link it is
            // a dead end, and this is by far the largest group of campaigns.
            const fix = el("td");
            const actionUrl = safeUrl(r.action_url);
            if (actionUrl) {
                const a = el("a", null, "Link account →");
                a.href = actionUrl;
                a.target = "_blank";
                a.rel = "noreferrer noopener";
                a.style.color = "var(--accent)";
                a.style.whiteSpace = "nowrap";
                fix.append(a);
            }
            tr.append(fix);

            const act = el("td");
            act.style.textAlign = "right";
            if (reason !== "excluded") {
              const ex = el("button", "tiny", "Hide");
              ex.title = "Never consider this campaign again";
              ex.onclick = () => send(s.account, {
                command: "set_campaign_excluded", campaign: r.id, excluded: true,
              });
              act.append(ex);
            } else {
              const inc = el("button", "tiny", "Un-hide");
              inc.onclick = () => send(s.account, {
                command: "set_campaign_excluded", campaign: r.id, excluded: false,
              });
              act.append(inc);
            }
            tr.append(act);
            tbody.append(tr);
          });
        table.append(tbody);
        panel.append(table);
        box.append(panel);
      });
    return box;
  }

  /// A titled panel holding one editable list, so every list on this tab is
  /// built the same way rather than each growing its own layout.
  function listPanel(opts) {
    const p = el("div", "panel pad setting");
    p.append(el("h2", null, opts.title));
    p.append(el("div", "sub", opts.blurb));

    const chips = el("div", "chips");
    chips.style.margin = "12px 0";
    if (!opts.items.length) chips.append(el("span", "faint", opts.empty));
    opts.items.forEach((item) => {
      const chip = el("div", "chip");
      chip.append(document.createTextNode(item.label));
      const x = el("button", null, "×");
      x.title = opts.removeTitle || "Remove";
      x.onclick = () => opts.onRemove(item);
      chip.append(x);
      chips.append(chip);
    });
    p.append(chips);

    if (opts.onAdd) {
      const row = el("div", "row");
      const submit = async (v) => {
        if (!v) return;
        if (await opts.onAdd(v)) clearDraft(opts.inputId);
      };
      const input = draftInput(opts.inputId, opts.placeholder, "", submit);
      input.style.flex = "1 1 160px";
      const btn = el("button", null, opts.addLabel || "Add");
      btn.onclick = () => submit(input.value.trim());
      row.append(input, btn);
      p.append(row);
    }
    return p;
  }

  /// Everything that decides *future* behaviour, in one place.
  ///
  /// These lists used to be spread across three surfaces: favourites were
  /// listed here but only settable from the Live now tab, campaign exclusions
  /// were only settable from a button on a campaign card and appeared nowhere
  /// as a list, and the pin sat in the hero next to the pause button. So there
  /// was no single screen that answered "what have I told this thing to do?",
  /// and undoing a campaign exclusion meant finding that campaign again among
  /// a hundred others.
  function settingsTab(s) {
    const box = el("div", "settings-grid");
    const acct = s.account;

    box.append(listPanel({
      title: "Favourite channels",
      blurb: "Preferred when the choice is otherwise close, under every strategy. Never overrides a real deadline.",
      items: (s.settings.favourites || []).map((f) => ({ label: f, value: f })),
      empty: "None yet — star a channel on the Live now tab, or add one here.",
      inputId: "fav-input",
      placeholder: "Channel login",
      onRemove: (i) => send(acct, { command: "set_favourite", login: i.value, on: false }),
      onAdd: (v) => send(acct, { command: "set_favourite", login: v, on: true }),
    }));

    box.append(listPanel({
      title: "Excluded games",
      blurb: "Every campaign for these games is skipped.",
      items: (s.settings.excluded_games || []).map((g) => ({ label: g, value: g })),
      empty: "None.",
      inputId: "exclude-input",
      placeholder: "Game name",
      addLabel: "Exclude",
      onRemove: (i) => send(acct, { command: "set_game_excluded", game: i.value, excluded: false }),
      onAdd: (v) => send(acct, { command: "set_game_excluded", game: v, excluded: true }),
    }));

    // Campaign exclusions were previously invisible: set from a card, listed
    // nowhere. An exclusion you cannot see is one you cannot undo.
    const excluded = s.settings.excluded_campaigns || [];
    const nameFor = (id) => {
      const hit = list0(s.eligible).concat(list0(s.rejected)).find((c) => c.id === id);
      // A campaign with no name still has an id, and the id is what the user
      // needs in order to un-exclude it. "null" is neither.
      return (hit && hit.name) || String(id);
    };
    box.append(listPanel({
      title: "Excluded campaigns",
      blurb: "Skipped individually, whatever their game. Set with the Exclude button on a campaign.",
      items: excluded.map((id) => ({ label: nameFor(id), value: id })),
      empty: "None.",
      onRemove: (i) => send(acct, {
        command: "set_campaign_excluded", campaign: i.value, excluded: false,
      }),
    }));

    // Pin. Moved off the hero: it configures how channels are chosen, which
    // is what this tab is for, and it sat next to Pause where it read like an
    // action rather than a setting.
    const pinPanel = el("div", "panel pad setting");
    pinPanel.append(el("h2", null, "Pinned channel"));
    pinPanel.append(el("div", "sub",
      "Watch only this channel, under the manual strategy. Ignored by the others."));
    const pinRow = el("div", "row");
    pinRow.style.marginTop = "12px";
    const submitPin = async (value) => {
      if (await send(acct, { command: "pin", channel: value || null })) clearDraft("pin-input");
    };
    const pin = draftInput("pin-input", "channel login", s.settings.pinned, submitPin);
    pin.style.flex = "1 1 140px";
    const savePin = el("button", null, "Pin");
    savePin.onclick = () => submitPin(pin.value.trim());
    pinRow.append(pin, savePin);
    if (s.settings.pinned) {
      const clear = el("button", "tiny", "Clear");
      clear.onclick = () => send(acct, { command: "pin", channel: null });
      pinRow.append(clear);
    }
    pinPanel.append(pinRow);
    if (s.settings.pinned && !(s.settings.strategy || "").startsWith("manual")) {
      const note = el("div", "hint");
      note.style.color = "var(--warn)";
      note.style.marginTop = "8px";
      note.textContent =
        `Pinned to ${s.settings.pinned}, but the ${s.settings.strategy} strategy ignores pins. ` +
        `Switch to manual for it to take effect.`;
      pinPanel.append(note);
    }
    box.append(pinPanel);

    // Diagnostics
    const p4 = el("div", "panel pad setting wide");
    p4.append(el("h2", null, "Status"));
    const dl = el("div", "sub");
    const lines = [
      `Account: ${s.account}${s.login ? " (" + s.login + ")" : ""}`,
      `State: ${s.state}`,
      `Watchdog: ${s.health.verdict}`,
      s.health.last_sync
        ? `Campaigns refreshed ${ago(Math.round((Date.now() - new Date(s.health.last_sync)) / 1000))}` +
          (num(s.health.next_sync_in_seconds) !== null
            ? `, next in ${Math.max(0, Math.round(s.health.next_sync_in_seconds / 60))}m`
            : "")
        : "Campaigns have not been refreshed yet",
    ];
    lines.forEach((t) => dl.append(el("div", null, t)));
    p4.append(dl);

    if (s.health.quarantined_channels.length || s.health.quarantined_campaigns.length) {
      p4.append(el("h2", null, "Resting after failure"));
      const ul = el("div", "sub");
      s.health.quarantined_channels.forEach((q) =>
        ul.append(el("div", null, `Channel ${q.name} — until ${new Date(q.until).toLocaleTimeString()}`)));
      s.health.quarantined_campaigns.forEach((q) =>
        ul.append(el("div", null, `Campaign ${q.name} — until ${new Date(q.until).toLocaleTimeString()}`)));
      p4.append(ul);
    }
    box.append(p4);

    return box;
  }

  function rewardsTab(s) {
    loadRewards(s.account);
    const box = el("div");

    // Only this account's. `state.rewards` is replaced when the fetch for the
    // new account lands, so between switching and that arrival the previous
    // account's rewards were listed — and totalled — as if they were this
    // one's.
    const list = (state.rewardsFor === s.account ? state.rewards : [])
      .filter((r) => matches(r.name));
    if (!list.length) {
      const p = el("div", "panel pad");
      p.style.marginTop = "16px";
      // Saying "nothing claimed" before the answer has arrived would be
      // telling the user something untrue, which is the one thing this
      // project is built not to do.
      const loadedThis = state.rewardsFor === s.account && state.rewardsLoaded;
      p.append(el("div", "empty",
        state.rewardsFetching === s.account ? "Loading…"
        : !loadedThis ? "Could not load the claim history. It will be retried."
        : list.length === 0 && state.rewards.length
          ? "Nothing matches that search."
          : "Nothing claimed yet. Rewards appear here as they are earned."));
      box.append(p);
      return box;
    }

    // Grouped by day, because "what did I get overnight" is the question.
    const byDay = new Map();
    list.forEach((r) => {
      const at = when(r.at);
      const day = at ? at.toDateString() : "date not recorded";
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(r);
    });

    const total = el("div", "sub");
    total.style.marginTop = "16px";
    total.textContent = `${plural(state.rewards.length, "reward")} claimed by this miner.`;
    box.append(total);

    byDay.forEach((items, day) => {
      const h = el("h2");
      h.append(document.createTextNode(day));
      h.append(el("span", "count", String(items.length)));
      box.append(h);

      const panel = el("div", "panel scroll");
      const table = el("table"), tbody = el("tbody");
      items.forEach((r) => {
        const tr = el("tr");
        const name = el("td");
        name.append(el("span", "pill ok", "claimed"));
        name.append(document.createTextNode(" " + r.name));
        tr.append(name);
        const at = when(r.at);
        tr.append(el("td", "sub num", at ? at.toLocaleTimeString() : "—"));
        tbody.append(tr);
      });
      table.append(tbody);
      panel.append(table);
      box.append(panel);
    });
    return box;
  }

  function logTab(s) {
    loadHistory(s.account);
    const panel = el("div", "panel");
    panel.style.marginTop = "16px";
    panel.id = "log";
    // Live lines first, then whatever the miner recorded before this page was
    // opened. Without the stored half, a restart looked like amnesia.
    const seen = new Set(state.log.map((l) => l.at + l.summary));
    // Stamping each stored line with the account currently on screen did not
    // merely show one account's history under another — it *asserted* the
    // lines belonged to it. The history is only used while it is the history
    // of the account being shown.
    const history = state.historyFor === s.account ? state.history : [];
    const merged = state.log.concat(
      history
        .filter((h) => !seen.has(h.at + h.summary))
        .filter((h) => h.severity !== "debug")
        .map((h) => ({
          at: h.at,
          account: state.historyFor,
          summary: h.summary,
          severity: h.severity,
        })),
    );

    if (!merged.length) {
      const e = el("div", "empty");
      e.style.padding = "14px";
      e.textContent = state.historyFetching === s.account ? "Loading…"
        : state.historyFor === s.account && state.historyLoaded
          ? "Nothing has happened yet."
          : "Could not load the stored history. It will be retried.";
      panel.append(e);
      return panel;
    }
    merged.forEach((item) => {
      const line = el("div", "line");
      const at = when(item.at);
      line.append(el("time", null, at ? at.toLocaleTimeString() : "—"));
      if (state.snapshots.size > 1) line.append(el("span", "who", item.account));
      line.append(el("span", "sev-" + (item.severity || "info"), item.summary));
      panel.append(line);
    });
    return panel;
  }

  /// Anything the user has to act on, above everything else.
  function attentionPanel() {
    const box = el("div");

    Object.entries(state.accountErrors).forEach(([account, detail]) => {
      const pending = state.logins.find((l) => l.account === account);
      if (pending && pending.status === "pending") return;

      const p = el("div", "banner bad");
      p.style.display = "flex";
      p.style.alignItems = "center";
      p.style.gap = "12px";
      p.style.flexWrap = "wrap";
      const text = el("div");
      text.append(el("div", null, `Account "${account}" has stopped: ${detail}`));
      text.append(el("div", "sub", "Other accounts are still mining."));
      p.append(text);

      const fix = el("button", "primary", "Sign in again");
      fix.onclick = () => beginLogin(account);
      p.append(fix);
      box.append(p);
    });

    state.logins.forEach((l) => {
      if (l.status === "pending" && l.user_code) {
        const p = el("div", "banner warn");
        p.append(el("div", null, `Sign in to "${l.account}"`));
        const row = el("div", "row");
        row.style.marginTop = "8px";
        const code = el("span", "headline", l.user_code);
        code.style.fontFamily = "ui-monospace, monospace";
        code.style.letterSpacing = "0.12em";
        row.append(code);
        const link = el("a", null, "Open twitch.tv/activate →");
        link.href = safeUrl(l.verification_uri) || "https://www.twitch.tv/activate";
        link.target = "_blank";
        link.rel = "noreferrer noopener";
        link.style.color = "inherit";
        row.append(link);
        p.append(row);
        p.append(el("div", "sub", "Enter that code on any device. Mining starts by itself."));
        box.append(p);
      } else if (l.status === "failed") {
        const p = el("div", "banner bad");
        p.append(el("div", null, `Signing in to "${l.account}" failed: ${l.detail || ""}`));
        const again = el("button", null, "Try again");
        again.style.marginTop = "8px";
        again.onclick = () => beginLogin(l.account);
        p.append(again);
        box.append(p);
      } else if (l.status === "starting") {
        box.append(el("div", "banner warn", `Asking Twitch for a code for "${l.account}"…`));
      }
    });
    return box;
  }

  function banners(s) {
    const box = el("div");
    if (s.watching && s.watching.stalled) {
      box.append(el("div", "banner bad",
        "Twitch has not confirmed progress recently. The miner is working its recovery ladder — " +
        "if this persists, check that spade.twitch.tv is not blocked by an adblocker or DNS filter."));
    }
    const impossible = s.eligible.filter((c) => c.slack_minutes < 0 && !c.excluded).length;
    if (impossible) {
      box.append(el("div", "banner warn",
        `${plural(impossible, "campaign")} can no longer be finished before the deadline and will not be mined.`));
    }
    return box;
  }

  /// Renders, or leaves what is on screen alone.
  ///
  /// The page used to build straight into `#app`, having emptied it first, and
  /// `render()` is called from inside the stream handler's try/catch — so one
  /// unexpected field threw, the throw was swallowed, and the user was left
  /// with a blank page: no hero, no stats, no tab strip, no way back. It
  /// stayed blank, because the next heartbeat carried the same field. That is
  /// the worst possible failure for a page whose job is to tell you what is
  /// happening.
  ///
  /// Building into a detached node first means a throw costs the *update*
  /// rather than the page. The last good render stays up and says so.
  function render() {
    connection();
    renderAccountPicker();

    const app = $("#app");
    const staging = document.createElement("div");
    try {
      build(staging, snap());
    } catch (e) {
      renderFailed(e);
      return;
    }
    const focus = captureFocus();
    app.replaceChildren(...staging.childNodes);
    restoreFocus(focus);
  }

  /// Reports a render that threw, without destroying the page that is up.
  function renderFailed(e) {
    if (state.renderError === String(e)) return; // do not nag every heartbeat
    state.renderError = String(e);
    console.error("dashboard render failed", e);
    toast("The dashboard could not draw this update — showing the last good one", true);
  }

  function captureFocus() {
    // Preserve focus and caret across the rebuild for whichever control the
    // user is in. Their *contents* are already safe in `state.drafts`; this is
    // so the cursor does not jump out mid-word.
    const active = document.activeElement;
    const id = active && active.id ? active.id : null;
    const caret = active && typeof active.selectionStart === "number"
      ? active.selectionStart : null;
    const log = $("#log");
    if (log) state.logScroll = log.scrollTop;
    return { id, caret, scrolled: window.scrollY };
  }

  function restoreFocus(f) {
    if (f.id) {
      const restored = document.getElementById(f.id);
      if (restored) {
        restored.focus();
        if (f.caret !== null && restored.setSelectionRange) {
          try { restored.setSelectionRange(f.caret, f.caret); } catch (e) { /* not a text box */ }
        }
      }
    }
    const newLog = $("#log");
    if (newLog) newLog.scrollTop = state.logScroll;
    window.scrollTo(0, f.scrolled);
  }

  function build(app, s) {
    if (!s) {
      app.append(attentionPanel());
      const p = el("div", "panel pad");
      p.style.marginTop = "20px";
      p.append(el("div", "empty", "No account is mining yet."));
      const add = el("button", "primary", "Link a Twitch account");
      add.style.marginTop = "10px";
      add.onclick = () => beginLogin("default");
      p.append(add);
      app.append(p);
      return;
    }
    state.current = s.account;
    state.renderError = null;

    app.append(attentionPanel());
    app.append(banners(s));

    const hero = el("div", "hero");
    hero.append(heroPanel(s));
    hero.append(controlsPanel(s));
    app.append(hero);

    const stats = statsStrip(s);
    stats.style.marginTop = "16px";
    app.append(stats);

    // Tabs
    const tabs = el("div", "tabs");
    const defs = [
      ["campaigns", "Campaigns", s.eligible.length],
      ["live", "Live now", s.live.length],
      ["unavailable", "Unavailable", s.rejected.length],
      ["rewards", "Rewards", null],
      ["settings", "Settings", null],
      ["log", "Activity", null],
    ];
    defs.forEach(([id, label, count]) => {
      const b = el("button", null, label);
      b.setAttribute("aria-selected", String(state.tab === id));
      if (count !== null && count !== undefined) {
        b.append(el("span", "badge", String(count)));
      }
      b.onclick = () => {
        // Re-entering a tab is the user asking again, so a failed fetch is
        // allowed another go.
        if (id !== state.tab) {
          state.rewardsAttempted = null;
          state.historyAttempted = null;
        }
        state.tab = id;
        render();
      };
      tabs.append(b);
    });
    app.append(tabs);

    if (["campaigns", "live", "unavailable", "rewards"].includes(state.tab)) {
      const searchRow = el("div", "row");
      searchRow.style.marginTop = "14px";
      const search = el("input");
      search.id = "search";
      search.type = "search";
      search.placeholder = "Filter by campaign, game or channel…";
      search.value = state.search;
      search.style.flex = "1 1 260px";
      // Store what was typed, and normalise only when *matching*. Storing the
      // trimmed lowercase form and writing it back on the next render rewrote
      // the box under the cursor: a trailing space never survived, so a
      // two-word search could not be entered at all, and capitals vanished as
      // they were typed.
      search.oninput = () => { state.search = search.value; render(); };
      searchRow.append(search);
      app.append(searchRow);
    }

    if (state.tab === "campaigns") app.append(campaignsTab(s));
    else if (state.tab === "live") app.append(liveTab(s));
    else if (state.tab === "unavailable") app.append(unavailableTab(s));
    else if (state.tab === "rewards") app.append(rewardsTab(s));
    else if (state.tab === "settings") app.append(settingsTab(s));
    else app.append(logTab(s));
  }

  // ---------------------------------------------------------------------
  // Live stream
  // ---------------------------------------------------------------------
  let source = null;
  function connect() {
    if (source) source.close();
    source = new EventSource(api("/api/events"));

    source.addEventListener("snapshot", (msg) => {
      try {
        const s = normalise(JSON.parse(msg.data));
        if (!s) return;
        const isNewAccount = !state.snapshots.has(s.account);
        state.snapshots.set(s.account, s);
        state.connected = true;
        // Rebuilding the page for an account that is not on screen would
        // interrupt the user for no visible benefit. With several accounts
        // mining, that is a rebuild every few seconds.
        if (isNewAccount || !state.current || s.account === state.current) {
          render();
        }
      } catch (e) { /* a malformed frame must not kill the page */ }
    });

    source.addEventListener("log", (msg) => {
      try {
        const item = JSON.parse(msg.data);
        // Heartbeats and per-campaign rejections would drown everything else.
        if (item.severity === "debug") return;
        state.log.unshift(item);
        if (state.log.length > 400) state.log.length = 400;
        if (state.tab === "log") render();
      } catch (e) { /* ignore */ }
    });

    // A full redraw, not just the header: the hero's figures stop being
    // current the moment the link drops, and they have to say so then rather
    // than at the next heartbeat — which by definition is not coming.
    source.onopen = () => { state.connected = true; connection(); render(); };
    source.onerror = () => { state.connected = false; connection(); render(); };
  }

  // A slow backstop only, in case the stream dies without firing onerror.
  async function poll() {
    try {
      const res = await fetch(api("/api/snapshots"));
      if (!res.ok) return;
      const list = await res.json();
      if (!Array.isArray(list)) return;
      const clean = list.map(normalise).filter(Boolean);
      clean.forEach((s) => state.snapshots.set(s.account, s));
      if (clean.length) { state.connected = true; render(); }
    } catch (e) { state.connected = false; connection(); }
  }

  // Theme
  const saved = localStorage.getItem("btdm-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  $("#theme").onclick = () => {
    const root = document.documentElement;
    const now = root.getAttribute("data-theme");
    const next = now === "dark" ? "light" : now === "light" ? "" : "dark";
    if (next) { root.setAttribute("data-theme", next); localStorage.setItem("btdm-theme", next); }
    else { root.removeAttribute("data-theme"); localStorage.removeItem("btdm-theme"); }
  };

  poll();
  loadLogins();
  connect();
  setInterval(poll, 60000);
  // A device code is only valid for minutes, and its state changes without
  // producing a snapshot, so this is polled rather than pushed.
  setInterval(loadLogins, 5000);
  // Deadline countdowns are wall-clock, so refresh them even when nothing
  // changes. This never touches a progress figure.
  setInterval(() => { if (state.tab === "campaigns") render(); }, 30000);
})();
</script>
</body>
</html>
